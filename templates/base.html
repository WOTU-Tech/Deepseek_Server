<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Local App</title>
    <script type="text/javascript" id="MathJax-script" async
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
    </script>

    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            /* Add background image */
            background-image: url('{{ url_for("static", filename="files/background.jpg") }}'); /* source: https://www.pexels.com/photo/lake-and-mountain-417074/ */
            background-size: cover; /* Ensures the image covers the entire background */
            background-position: center; /* Centers the image */
            background-repeat: no-repeat; /* Prevents the image from repeating */
        }
        .container {
            background: rgba(95, 168, 64, 0.9); /* Slightly transparent white background */
            padding: 30px;
            max-width: 400px;
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .response-box {
            background-color: #0273f5; /* Black background */
            color: #fff; /* White text */
            padding: 15px;
            border-radius: 8px;
            max-width: 100%;
            word-wrap: break-word;
            font-size: 16px;
            margin-top: 20px;
            text-align: left;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); /* Optional shadow for better visibility */
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin: 15px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .response {
            margin-top: 20px;
            color: #333;
            font-weight: bold;
        }
        pre {
            background-color: #020202;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
        }

        code {
            background-color: #020202;
            padding: 2px 4px;
            border-radius: 3px;
            font-family: 'Courier New', Courier, monospace;
        }
        #dropZone {
            border: 2px dashed #007bff;
            border-radius: 8px;
            padding: 20px;
            margin: 15px 0;
            background-color: rgba(0, 123, 255, 0.05);
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }
        #dropZone:hover,
        #dropZone.dragover {
            border-color: #0056b3;
            background-color: rgba(0, 123, 255, 0.1);
        }
        #dropZone p {
            margin: 5px 0;
            font-size: 14px;
            color: #666;
        }
        #fileInput {
            display: none;
        }
        .document-list {
            margin-top: 15px;
            text-align: left;
        }
        .document-item {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
        }
        .document-item button {
            padding: 5px 10px;
            font-size: 11px;
            background-color: #dc3545;
            margin-left: 10px;
        }
        .document-item button:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>You Ask Deep, I Seek Deeper</h1>
        <form method="POST">
            <input type="text" name="query" placeholder="Type your question... or type ### to clear cache" required>
            <br>
            <label style="display: flex; align-items: center; justify-content: center; margin: 10px 0;">
                <input type="checkbox" name="use_tools" checked style="margin-right: 8px;">
                <span style="font-size: 14px;">Enable Tools (web search, calculator)</span>
            </label>
            <button type="submit">Submit</button>
        </form>

        <!-- Document drop zone -->
        <div id="dropZone">
            <p>Drag & drop a document here</p>
            <p style="font-size: 12px; color: #999;">or click to browse (TXT, PDF, DOCX, MD)</p>
        </div>
        <input type="file" id="fileInput" accept=".txt,.pdf,.docx,.md">

        <!-- Document list -->
        <div class="document-list" id="documentList"></div>

        <!-- Chat box -->
        <div class="chat-box">
            {% if response %}
            <div class="response-box">
                <p>{{ response | safe }}</p>
            </div>
            {% endif %}
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const documentList = document.getElementById('documentList');

        // Click to browse
        dropZone.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                uploadFile(e.target.files[0]);
                fileInput.value = '';
            }
        });

        // Drag and drop events
        ['dragenter', 'dragover'].forEach(evt => {
            dropZone.addEventListener(evt, (e) => {
                e.preventDefault();
                dropZone.classList.add('dragover');
            });
        });

        ['dragleave', 'drop'].forEach(evt => {
            dropZone.addEventListener(evt, (e) => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
            });
        });

        dropZone.addEventListener('drop', (e) => {
            if (e.dataTransfer.files.length > 0) {
                uploadFile(e.dataTransfer.files[0]);
            }
        });

        function uploadFile(file) {
            const formData = new FormData();
            formData.append('file', file);

            dropZone.querySelector('p').textContent = 'Uploading...';

            fetch('/v1/api/documents/upload', {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    dropZone.querySelector('p').textContent = data.message;
                    setTimeout(() => loadDocuments(), 2000);
                } else {
                    dropZone.querySelector('p').textContent = 'Error: ' + data.error;
                    setTimeout(() => resetDropZone(), 3000);
                }
            })
            .catch(err => {
                dropZone.querySelector('p').textContent = 'Upload failed: ' + err;
                setTimeout(() => resetDropZone(), 3000);
            });
        }

        function resetDropZone() {
            dropZone.querySelector('p').textContent = 'Drag & drop a document here';
        }

        function loadDocuments() {
            fetch('/v1/api/documents/list')
            .then(res => res.json())
            .then(data => {
                documentList.innerHTML = '';
                if (data.documents.length === 0) return;

                data.documents.forEach(doc => {
                    const item = document.createElement('div');
                    item.className = 'document-item';
                    item.innerHTML = `
                        <span><a href="#" onclick="event.preventDefault(); copyDocId('${doc.id}')" title="Click to copy ID" style="color: #90caf4; text-decoration: underline;">${doc.filename}</a> (${doc.chunk_count} chunks)</span>
                        <button onclick="deleteDocument('${doc.id}')">Delete</button>
                    `;
                    documentList.appendChild(item);
                });
            });
        }

        function deleteDocument(docId) {
            fetch(`/v1/api/documents/${docId}/delete`, { method: 'DELETE' })
            .then(() => loadDocuments());
        }

        function copyDocId(docId) {
            navigator.clipboard.writeText(docId).then(() => {
                alert('Copied document ID: ' + docId);
            });
        }

        // Load documents on page load
        loadDocuments();
    </script>
</body>
</html>
